services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "5544:5432"
    volumes:
      - metering-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  metering-postgres-data:
