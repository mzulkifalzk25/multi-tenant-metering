[project]
name = "async-document-pipeline"
version = "1.0.0"
description = "Production-grade async document processing pipeline with idempotent job orchestration"
authors = [{ name = "Muhammad Zulkifal Qayyum" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.104.0,<0.105",
    "uvicorn[standard]>=0.24.0,<0.25",
    "celery>=5.3.0,<5.4",
    "sqlalchemy>=2.0.0,<2.1",
    "asyncpg>=0.29.0,<0.30",
    "redis>=5.0.0,<5.1",
    "pydantic>=2.5.0,<3.0",
    "structlog>=23.2.0,<24.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<7.5",
    "pytest-asyncio>=0.21.0,<0.22",
    "pytest-cov>=4.1.0,<5.0",
    "mypy>=1.7.0,<1.8",
    "ruff>=0.1.0,<0.2",
    "black>=23.12.0,<24.0",
    "types-redis>=4.6.0",
    "httpx>=0.25.0,<0.26",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real PostgreSQL + Redis + Celery broker",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
disallow_any_generics = true
warn_unused_ignores = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*"]
ignore_missing_imports = true
